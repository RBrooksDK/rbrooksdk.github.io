# Project information
site_name: Richard Brooks
site_url: https://rbrooksdk.github.io/
site_author: Richard Brooks
site_description: Course sites, supervision and resources from Richard Brooks, Associate Professor at VIA Software Engineering, Horsens.
docs_dir: .
site_dir: _site
exclude_docs: |
  _site/**
  data/**
  hooks/**
  templates/**
  COURSE_YML.md
  CLAUDE.md
  requirements.txt
  figures/profile_pic.png
  figures/logo.png

validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: warn

# Repository information
repo_name: Github
repo_url: https://github.com/RBrooksDK/rbrooksdk.github.io

copyright: Copyright &copy; 2026 Richard Brooks

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: figures/rb-mark.svg
  logo: figures/rb-mark.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - announce.dismiss
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      accent: orange
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: orange
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  font:
    text: "VIA Type"
    code: "Roboto Mono"

hooks:
  - hooks/catalog.py

plugins:
  - same-dir
  - search
  - blog

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js
  - javascripts/rb.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/rb.css

extra:
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  social:
    - icon: material/email
      link: mailto:rib@via.dk
    - icon: fontawesome/brands/github
      link: https://github.com/RBrooksDK/
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/rbrooks-dk/

nav:
  - Home: README.md
  - Courses: courses.md
  - Supervision: supervision.md
  - Resources: resources.md
  - Blog:
    - blog/index.md

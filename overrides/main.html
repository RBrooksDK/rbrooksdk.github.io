{% extends "base.html" %}

{#- The Ctrl K palette is available on every page of the main site. -#}
{% block footer %}
{{ super() }}
<div class="rb-palette" id="rb-palette" hidden>
  <div class="rb-palette__backdrop" data-rb-close></div>
  <div class="rb-palette__panel" role="dialog" aria-modal="true" aria-label="Explore courses and pages">
    <div class="rb-palette__bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label for="rb-palette-q" class="rb-sr">Search courses, sessions and pages</label>
      <input id="rb-palette-q" type="text" autocomplete="off" spellcheck="false" placeholder="Search courses, sessions, pages…" role="combobox" aria-expanded="true" aria-controls="rb-palette-list">
      <button type="button" class="rb-palette__esc" data-rb-close aria-label="Close">Esc</button>
    </div>
    <ul class="rb-palette__list" id="rb-palette-list" role="listbox"></ul>
    <div class="rb-palette__foot">↑ ↓ to move · Enter to open · Esc to close</div>
  </div>
</div>
<script id="rb-palette-data" type="application/json">{{ config.extra.catalog.palette | tojson }}</script>
{% endblock %}

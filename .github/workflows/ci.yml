name: Build and deploy

# The site rebuilds itself every night, so course progress is always current.
# Nothing has to be committed for that: the build reads each course repo's
# course.yml directly (see COURSE_YML.md).
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"   # 23:00 Copenhagen in winter, 00:00 in summer
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  repository_dispatch:
    types: [course-updated] # optional: a course repo can ping for an instant rebuild

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          key: mkdocs-${{ github.ref }}
          path: .cache

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and deploy
        run: mkdocs gh-deploy --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}
          DISABLE_MKDOCS_2_WARNING: "true"

      # GitHub switches scheduled workflows off after 60 days without a commit.
      # If the repo has been quiet for 45 days, add an empty commit so the
      # nightly rebuild keeps running through holidays.
      - name: Keep the nightly schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( now - last )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "Keepalive: nightly rebuild stays enabled"
            git push
          fi

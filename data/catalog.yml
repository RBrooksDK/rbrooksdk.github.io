# ============================================================================
# Catalogue of everything shown on rbrooksdk.github.io
# ----------------------------------------------------------------------------
# The build hook (hooks/catalog.py) reads this file every night.
#
# * An entry with `repo:` also gets the repo's own `course.yml` (if it has
#   one) merged on top. That is how a course updates its own progress.
# * `discover: true` means: any other public repo under `owner` that has a
#   `course.yml` in its root is picked up automatically. A new course
#   (e.g. spring 2027) therefore needs NO change here: just add a
#   course.yml to its repo. See COURSE_YML.md.
#
# Status (running / upcoming / completed) is computed, not typed:
#   - from session dates in course.yml, or
#   - from `current` + `ends` (used for the autumn 2026 courses below).
# ============================================================================

owner: RBrooksDK
discover: true

courses:

  # --- Autumn 2026 (manual progress: bump `current` after each session) ----
  - repo: STA1_26
    code: STA1
    title: Statistics and Data Analysis for Engineers
    term: Autumn 2026
    year: 2026
    lang: en
    area: stat
    glyph: "x̄"
    description: From descriptive statistics to regression, in Python, with six group assignments and a project.
    current: 10
